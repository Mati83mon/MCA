[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mca-framework"
version = "0.1.0"
description = "Metacognitive Control Architecture: neuro-symbolic middleware that gates LLM generation with premise validation, semantic entropy, Z3 logic checks and evidence grounding."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "MCA contributors" }]
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.24",
    "z3-solver>=4.12",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "accelerate>=0.33",
]
faiss = ["faiss-cpu>=1.8"]
hub = ["huggingface_hub>=0.24", "datasets>=2.20"]
space = ["gradio>=4.44", "spaces>=0.30"]
bench = ["matplotlib>=3.8", "huggingface_hub>=0.24"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mca-bench = "benchmarks.runner:main"
mca-ingest = "scripts.ingest_daily_json:main"

[tool.hatch.build.targets.wheel]
packages = ["mca", "benchmarks", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
